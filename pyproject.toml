[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-agent"
version = "0.1.0"
description = "An e-commerce customer service and product recommendation agent."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlmodel>=0.0.22,<1.0",
]

[project.optional-dependencies]
agent = [
    "langchain>=0.3,<2.0",
    "langgraph>=0.2,<2.0",
    "langchain-openai>=0.2,<2.0",
    "qdrant-client>=1.12,<2.0",
    "fastembed>=0.4,<1.0",
]
demo = [
    "streamlit>=1.40,<2.0",
    "httpx>=0.27,<1.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1.0",
    "httpx>=0.27,<1.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]